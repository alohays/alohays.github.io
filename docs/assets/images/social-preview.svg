<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3f51b5"/>
      <stop offset="50%" style="stop-color:#5c6bc0"/>
      <stop offset="100%" style="stop-color:#3f51b5"/>
    </linearGradient>

    <!-- Subtle pattern overlay -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#ffffff" opacity="0.1"/>
    </pattern>

    <!-- Logo glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Grid pattern overlay -->
  <rect width="100%" height="100%" fill="url(#gridPattern)"/>

  <!-- Decorative neural network lines -->
  <g stroke="#ffffff" stroke-width="1" fill="none" opacity="0.1">
    <path d="M 0 150 Q 200 100 400 180 T 800 120 T 1200 200"/>
    <path d="M 0 350 Q 300 280 500 350 T 900 300 T 1200 380"/>
    <path d="M 0 500 Q 250 450 450 520 T 850 480 T 1200 550"/>
  </g>

  <!-- Decorative circles -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="100" cy="100" r="80"/>
    <circle cx="1100" cy="530" r="100"/>
    <circle cx="950" cy="80" r="50"/>
  </g>

  <!-- YSL Logo - Large version on left -->
  <g transform="translate(120, 165)" filter="url(#glow)">
    <g fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Y letter -->
      <path d="M 0 0 L 70 100 L 70 160"/>
      <path d="M 140 0 L 70 100"/>

      <!-- S letter -->
      <path d="M 190 30
               C 190 10, 160 0, 135 0
               C 100 0, 80 20, 80 50
               C 80 80, 100 95, 135 105
               C 170 115, 195 130, 195 165
               C 195 200, 165 220, 135 220
               C 105 220, 75 205, 75 175"/>

      <!-- L letter -->
      <path d="M 70 160 L 70 280 L 220 280"/>
    </g>

    <!-- Decorative dots -->
    <circle cx="70" cy="100" r="6" fill="#ffffff"/>
    <circle cx="70" cy="160" r="6" fill="#ffffff"/>
  </g>

  <!-- Vertical separator line -->
  <line x1="480" y1="165" x2="480" y2="465" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <!-- Text content - right side -->
  <g fill="#ffffff">
    <!-- Name -->
    <text x="540" y="280" font-family="Georgia, serif" font-size="72" font-weight="700" letter-spacing="2">
      Yunsung Lee
    </text>

    <!-- Title -->
    <text x="540" y="340" font-family="Arial, sans-serif" font-size="32" font-weight="400" opacity="0.9">
      AI/ML Research Engineer
    </text>

    <!-- Subtitle -->
    <text x="540" y="390" font-family="Arial, sans-serif" font-size="24" font-weight="300" opacity="0.7">
      Head of Research @ Maum.ai
    </text>

    <!-- Tagline -->
    <text x="540" y="450" font-family="Arial, sans-serif" font-size="20" font-style="italic" opacity="0.6">
      Embodied AI | Vision-Language-Action | Robotics
    </text>
  </g>

  <!-- Website URL -->
  <text x="540" y="520" font-family="monospace" font-size="18" fill="#ffffff" opacity="0.5">
    alohays.github.io
  </text>

  <!-- Corner accent -->
  <g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.2">
    <path d="M 1150 50 L 1150 20 L 1180 20"/>
    <path d="M 20 580 L 20 610 L 50 610"/>
  </g>
</svg>
