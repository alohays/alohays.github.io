<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Gradient for nodes -->
    <radialGradient id="nodeGlow">
      <stop offset="0%" style="stop-color:#3f51b5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#3f51b5;stop-opacity:0"/>
    </radialGradient>

    <!-- Background gradient -->
    <linearGradient id="bgFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e8eaf6;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgFade)"/>

  <!-- Neural network connections -->
  <g stroke="#c5cae9" stroke-width="1" fill="none" opacity="0.6">
    <!-- Connection lines -->
    <path d="M 50 100 Q 150 50 250 120"/>
    <path d="M 250 120 L 400 80"/>
    <path d="M 400 80 Q 500 120 600 60"/>
    <path d="M 600 60 L 750 100"/>
    <path d="M 750 100 Q 850 50 950 90"/>
    <path d="M 950 90 L 1100 70"/>
    <path d="M 1100 70 Q 1150 100 1200 80"/>

    <path d="M 100 250 L 200 200"/>
    <path d="M 200 200 Q 350 180 450 220"/>
    <path d="M 450 220 L 550 180"/>
    <path d="M 550 180 Q 700 200 800 160"/>
    <path d="M 800 160 L 950 200"/>
    <path d="M 950 200 Q 1050 170 1150 210"/>

    <path d="M 0 400 Q 100 350 200 380"/>
    <path d="M 200 380 L 350 340"/>
    <path d="M 350 340 Q 500 380 600 320"/>
    <path d="M 600 320 L 700 360"/>
    <path d="M 700 360 Q 850 310 1000 350"/>
    <path d="M 1000 350 L 1100 320"/>
    <path d="M 1100 320 Q 1150 350 1200 330"/>

    <path d="M 80 520 L 180 480"/>
    <path d="M 180 480 Q 300 520 420 470"/>
    <path d="M 420 470 L 580 510"/>
    <path d="M 580 510 Q 720 460 850 500"/>
    <path d="M 850 500 L 980 460"/>
    <path d="M 980 460 Q 1100 500 1200 470"/>

    <!-- Cross connections -->
    <path d="M 250 120 Q 200 180 200 200" opacity="0.4"/>
    <path d="M 400 80 Q 430 150 450 220" opacity="0.4"/>
    <path d="M 600 60 Q 580 120 550 180" opacity="0.4"/>
    <path d="M 800 160 Q 750 250 700 360" opacity="0.4"/>
    <path d="M 200 380 Q 220 300 200 200" opacity="0.4"/>
    <path d="M 600 320 L 580 510" opacity="0.4"/>
    <path d="M 1000 350 Q 990 420 980 460" opacity="0.4"/>
  </g>

  <!-- Neural network nodes -->
  <g fill="#3f51b5" opacity="0.15">
    <!-- Top layer -->
    <circle cx="50" cy="100" r="8"/>
    <circle cx="250" cy="120" r="10"/>
    <circle cx="400" cy="80" r="6"/>
    <circle cx="600" cy="60" r="12"/>
    <circle cx="750" cy="100" r="8"/>
    <circle cx="950" cy="90" r="10"/>
    <circle cx="1100" cy="70" r="7"/>

    <!-- Second layer -->
    <circle cx="100" cy="250" r="6"/>
    <circle cx="200" cy="200" r="10"/>
    <circle cx="450" cy="220" r="8"/>
    <circle cx="550" cy="180" r="12"/>
    <circle cx="800" cy="160" r="9"/>
    <circle cx="950" cy="200" r="7"/>
    <circle cx="1150" cy="210" r="10"/>

    <!-- Third layer -->
    <circle cx="200" cy="380" r="11"/>
    <circle cx="350" cy="340" r="7"/>
    <circle cx="600" cy="320" r="10"/>
    <circle cx="700" cy="360" r="8"/>
    <circle cx="1000" cy="350" r="12"/>
    <circle cx="1100" cy="320" r="6"/>

    <!-- Bottom layer -->
    <circle cx="80" cy="520" r="8"/>
    <circle cx="180" cy="480" r="10"/>
    <circle cx="420" cy="470" r="7"/>
    <circle cx="580" cy="510" r="11"/>
    <circle cx="850" cy="500" r="9"/>
    <circle cx="980" cy="460" r="8"/>
  </g>

  <!-- Glowing accent nodes -->
  <g>
    <circle cx="600" cy="60" r="30" fill="url(#nodeGlow)"/>
    <circle cx="550" cy="180" r="25" fill="url(#nodeGlow)"/>
    <circle cx="600" cy="320" r="28" fill="url(#nodeGlow)"/>
    <circle cx="1000" cy="350" r="24" fill="url(#nodeGlow)"/>
  </g>

  <!-- Geometric accent shapes -->
  <g fill="none" stroke="#9fa8da" stroke-width="1" opacity="0.3">
    <polygon points="580,150 620,150 600,120"/>
    <polygon points="980,320 1020,320 1000,290"/>
    <rect x="185" y="365" width="30" height="30" rx="5"/>
    <rect x="565" y="495" width="30" height="30" rx="5"/>
  </g>
</svg>
