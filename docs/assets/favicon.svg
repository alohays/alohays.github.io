<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3f51b5"/>
      <stop offset="100%" style="stop-color:#5c6bc0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>

  <!-- YSL Monogram - Elegant interlocking design -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Y letter - top arms -->
    <path d="M 150 120 L 220 220 L 220 280"/>
    <path d="M 290 120 L 220 220"/>

    <!-- S letter - flowing curve in center -->
    <path d="M 310 180
             C 310 160, 280 150, 256 150
             C 220 150, 200 170, 200 195
             C 200 220, 220 235, 256 245
             C 292 255, 312 270, 312 300
             C 312 330, 285 350, 256 350
             C 227 350, 200 340, 200 315"/>

    <!-- L letter - bottom -->
    <path d="M 220 280 L 220 380 L 340 380"/>
  </g>

  <!-- Decorative dots at intersections -->
  <circle cx="220" cy="220" r="8" fill="#ffffff"/>
  <circle cx="220" cy="280" r="8" fill="#ffffff"/>
</svg>
