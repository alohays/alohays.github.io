{% extends "base.html" %}

{% block extrahead %}
  <!-- Favicon set -->
  <link rel="icon" type="image/svg+xml" href="{{ config.site_url }}assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ config.site_url }}assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ config.site_url }}assets/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ config.site_url }}assets/apple-touch-icon.png">

  <!-- Open Graph / Social Preview -->
  <meta property="og:image" content="{{ config.site_url }}assets/images/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}assets/images/social-preview.png">
{% endblock %}
