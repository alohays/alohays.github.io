{% extends "base.html" %}

{% block extrahead %}
  <!-- Favicon set -->
  <link rel="icon" type="image/svg+xml" href="{{ config.site_url }}assets/favicon.svg">
  <link rel="icon" type="image/png" href="{{ config.site_url }}assets/favicon.png">

  <!-- Open Graph / Social Preview (PNG required; most platforms don't support SVG) -->
  <meta property="og:image" content="{{ config.site_url }}assets/images/social-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}assets/images/social-preview.png">
{% endblock %}
