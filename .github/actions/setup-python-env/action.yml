name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.12"
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.6.14"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    # setup-uv publishes floating major tags only up to v7; v8 and v9 exist as
    # exact versions only, so @v7 is the newest tag that both resolves and runs
    # on node24. Bump past this only with an exact version.
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: "true"
        cache-suffix: ${{ inputs.python-version }}

    - name: Install Python dependencies
      run: uv sync --frozen
      shell: bash
