name: Update CV Submodule

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  update-cv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Update submodule
        run: |
          git submodule update --remote docs/cv/yunsungs_cv

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status -s docs/cv/yunsungs_cv) ]]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          fi

      - name: Build PDF
        if: steps.check_changes.outputs.changes_detected == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Resume_for_Frehers.tex
          working_directory: docs/cv/yunsungs_cv

      - name: Copy PDF
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          cp docs/cv/yunsungs_cv/Resume_for_Frehers.pdf docs/cv/cv.pdf

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/cv/yunsungs_cv docs/cv/cv.pdf
          git commit -m "Update CV submodule and regenerate PDF"
          git push
