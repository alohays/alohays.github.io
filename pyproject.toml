[project]
name = "alohays-github-io"
version = "0.0.1"
description = "Personal website and blog of Yunsung Lee, built with MkDocs Material"
authors = [{ name = "Yunsung Lee", email = "dldbstjd9751@gmail.com" }]
readme = "README.md"
